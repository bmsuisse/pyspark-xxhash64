[project]
name = "pyspark-xxhash64"
version = "0.1.0"
description = "PySpark-compatible xxhash64(), in pure Python (no JVM, no pyspark dependency)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyspark_xxhash64"]
