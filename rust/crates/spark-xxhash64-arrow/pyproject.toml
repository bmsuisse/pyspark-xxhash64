[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "spark-xxhash64-arrow"
version = "0.1.0"
description = "Fast, native Spark-compatible xxhash64() for Arrow arrays (Rust) -- works with pyarrow, nanoarrow, polars, or anything implementing the Arrow PyCapsule Interface"
requires-python = ">=3.9"

[tool.maturin]
module-name = "spark_xxhash64_arrow"
